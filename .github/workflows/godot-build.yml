name: Godot Tests & Build

on:
  push:
    paths:
      - 'addons/**'
      - 'assets/**'
      - 'resources/**'
      - 'scenes/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - '.godot/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'icon.svg'
      - 'icon.svg.import'
      - '.github/workflows/godot-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'addons/**'
      - 'assets/**'
      - 'resources/**'
      - 'scenes/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - '.godot/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'icon.svg'
      - 'icon.svg.import'
      - '.github/workflows/godot-build.yml'

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          lfs: true

      - name: Verify Godot setup
        run: |
          test -f project.godot || { echo "project.godot not found"; exit 1; }
          test -f export_presets.cfg || { echo "export_presets.cfg not found"; exit 1; }
          grep -q 'name="WindowsDesktop"' export_presets.cfg || {
            echo "WindowsDesktop export preset not found"; cat export_presets.cfg; exit 1;
          }
          godot --version

      - name: Import project
        run: |
          godot --headless --path . --import

      - name: Run GdUnit4 tests
        run: |
          godot --headless --path . -s addons/gdUnit4/bin/GdUnitCmdTool.gd --testsuite=tests/

  build_on_main:
    name: Build Windows on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          lfs: true

      - name: Verify Godot setup
        run: |
          test -f project.godot || { echo "project.godot not found"; exit 1; }
          test -f export_presets.cfg || { echo "export_presets.cfg not found"; exit 1; }
          grep -q 'name="WindowsDesktop"' export_presets.cfg || {
            echo "WindowsDesktop export preset not found"; cat export_presets.cfg; exit 1;
          }
          godot --version

      - name: Setup export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.stable"
          if [ -d /root/.local/share/godot/export_templates/4.4.stable ] && [ "/root/.local/share/godot/export_templates/4.4.stable" != "$HOME/.local/share/godot/export_templates/4.4.stable" ]; then
            cp -a /root/.local/share/godot/export_templates/4.4.stable/. "$HOME/.local/share/godot/export_templates/4.4.stable/"
          fi

      - name: Import project
        run: |
          godot --headless --path . --import

      - name: Build Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "WindowsDesktop" build/windows/BTechSimulator.exe

      - uses: actions/upload-artifact@v5
        with:
          name: GodotBuild-WindowsDesktop
          path: build/windows
          retention-days: 1
