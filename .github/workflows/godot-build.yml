name: Build Godot Project

on:
  push:
    paths:
      - 'addons/**'
      - 'assets/**'
      - 'resources/**'
      - 'scenes/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - '.godot/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'icon.svg'
      - 'icon.svg.import'
      - '.github/workflows/godot-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'addons/**'
      - 'assets/**'
      - 'resources/**'
      - 'scenes/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - '.godot/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'icon.svg'
      - 'icon.svg.import'
      - '.github/workflows/godot-build.yml'

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Import project
        run: |
          godot --headless --import

      - name: Run GdUnit4 tests
        run: |
          godot --headless -s addons/gdUnit4/bin/GdUnitCmdTool.gd --testsuite=tests/

  build_on_main:
    name: Build Windows on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.stable
          mv /root/.local/share/godot/export_templates/4.4.stable/* ~/.local/share/godot/export_templates/4.4.stable/ || true

      - name: Import project
        run: |
          godot --headless --import

      - name: Build Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" ../build/windows/BTechSimulator.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Build-windows
          path: build/windows
          retention-days: 7
