name: Unity Tests & Build

on:
  push:                                      # all branches: tests on non-main, build on main (merge)
  pull_request:
    types: [opened, synchronize, reopened]   # gate merges into main
    branches: [ main ]

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------
  # 1) PUSH (non-main): run tests in parallel (editmode + playmode) x shards
  # -------------------------------------------------------
  test_on_push:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    name: Tests on push (${{ matrix.testMode }} - ${{ matrix.shard.name }}) - ${{ github.ref_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [ editmode, playmode ]
        shard:
          - name: Core
            selector: "-testCategory Core"
          - name: Integration
            selector: "-testCategory Integration"

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Print ref being tested
        run: |
          echo "Event  : ${{ github.event_name }}"
          echo "Branch : ${{ github.ref_name }}"
          echo "SHA    : ${{ github.sha }}"
          echo "Mode   : ${{ matrix.testMode }}"
          echo "Shard  : ${{ matrix.shard.name }}"
          git --no-pager log -1 --oneline

      - name: Cache Unity Library (per mode + shard)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ matrix.shard.name }}-${{ hashFiles('Assets/**','Packages/**','ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-${{ matrix.shard.name }}-
            Library-${{ matrix.testMode }}-
            Library-

      - name: Verify Unity version (6000.3.9f1)
        run: |
          test -f ProjectSettings/ProjectVersion.txt || { echo "ProjectVersion.txt not found"; exit 1; }
          grep -q 'm_EditorVersion: 6000.3.9f1' ProjectSettings/ProjectVersion.txt || {
            echo "Unity version mismatch. Expected 6000.3.9f1"; cat ProjectSettings/ProjectVersion.txt; exit 1;
          }

      - name: Run Unity tests (${{ matrix.testMode }} - ${{ matrix.shard.name }})
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: ${{ matrix.testMode }}
          customParameters: ${{ matrix.shard.selector }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: "${{ matrix.testMode }} - ${{ matrix.shard.name }} Test Results"

      - name: Upload test artifacts (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ github.ref_name }}-${{ matrix.testMode }}-${{ matrix.shard.name }}
          path: ${{ steps.tests.outputs.artifactsPath || 'artifacts' }}
          retention-days: 1
          if-no-files-found: ignore

  # -----------------------------------------------------------------------
  # 2) PR: first look for the latest push-run on the same head SHA
  # -----------------------------------------------------------------------
  pr_lookup:
    if: github.event_name == 'pull_request'
    name: PR gate - lookup last push result
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      prior_conclusion: ${{ steps.decide.outputs.prior_conclusion }}

    steps:
      - name: Lookup latest PUSH run for this head commit
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          json=$(gh api -H "Accept: application/vnd.github+json" \
                 "/repos/${OWNER_REPO}/actions/runs?head_sha=${HEAD_SHA}&event=push&per_page=1")
          status=$(echo "$json" | jq -r '.workflow_runs[0].status // empty')
          conclusion=$(echo "$json" | jq -r '.workflow_runs[0].conclusion // empty')
          echo "found_status=$status"         >> "$GITHUB_OUTPUT"
          echo "found_conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "Found push run: status=$status, conclusion=$conclusion"

      - name: Decide
        id: decide
        run: |
          if [ "${{ steps.lookup.outputs.found_status }}" = "completed" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "prior_conclusion=${{ steps.lookup.outputs.found_conclusion }}" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "prior_conclusion=" >> "$GITHUB_OUTPUT"
          fi

  # -----------------------------------------------------------------------
  # 3) PR: reuse PASS/FAIL; if missing, run tests (parallel) as fallback
  # -----------------------------------------------------------------------
  pr_gate_reuse:
    if: github.event_name == 'pull_request' && needs.pr_lookup.outputs.should_run == 'false'
    needs: pr_lookup
    name: PR gate - reuse prior result
    runs-on: ubuntu-latest
    steps:
      - name: Reuse PASS
        if: needs.pr_lookup.outputs.prior_conclusion == 'success'
        run: echo "Previous push-run PASSED. Marking PR check as PASS."

      - name: Reuse FAIL
        if: needs.pr_lookup.outputs.prior_conclusion != 'success'
        run: |
          echo "Previous push-run FAILED. Blocking merge."
          exit 1

  pr_gate_fallback:
    if: github.event_name == 'pull_request' && needs.pr_lookup.outputs.should_run == 'true'
    needs: pr_lookup
    name: PR gate - run tests (fallback) - ${{ matrix.testMode }} - ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [ editmode, playmode ]
        shard:
          - name: Core
            selector: "-testCategory Core"
          - name: Integration
            selector: "-testCategory Integration"

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library (per mode + shard)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ matrix.shard.name }}-${{ hashFiles('Assets/**','Packages/**','ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-${{ matrix.shard.name }}-
            Library-${{ matrix.testMode }}-
            Library-

      - name: Verify Unity version (6000.3.9f1)
        run: |
          test -f ProjectSettings/ProjectVersion.txt || { echo "ProjectVersion.txt not found"; exit 1; }
          grep -q 'm_EditorVersion: 6000.3.9f1' ProjectSettings/ProjectVersion.txt || {
            echo "Unity version mismatch. Expected 6000.3.9f1"; cat ProjectSettings/ProjectVersion.txt; exit 1;
          }

      - name: Run Unity tests (${{ matrix.testMode }} - ${{ matrix.shard.name }})
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: ${{ matrix.testMode }}
          customParameters: ${{ matrix.shard.selector }}
          githubToken: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.GITHUB_TOKEN || '' }}
          checkName: "PR ${{ matrix.testMode }} - ${{ matrix.shard.name }} Test Results"

      - name: Upload test artifacts (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PR-TestResults-${{ github.event.pull_request.head.ref }}-${{ matrix.testMode }}-${{ matrix.shard.name }}
          path: ${{ steps.tests.outputs.artifactsPath || 'artifacts' }}
          retention-days: 1
          if-no-files-found: ignore

  # -----------------------------------------------------------------------
  # 4) MERGE TO MAIN: build only when code lands on main (via merged PR)
  #    Tests already passed via PR gate - go straight to build.
  # -----------------------------------------------------------------------
  build_on_merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Build on merge (${{ matrix.buildMatrix.targetPlatform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        buildMatrix:
          - targetPlatform: StandaloneWindows64
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library (build)
        uses: actions/cache@v4
        with:
          path: Library
          key: BuildLib-${{ matrix.buildMatrix.targetPlatform }}-${{ hashFiles('Assets/**','Packages/**','ProjectSettings/**') }}
          restore-keys: |
            BuildLib-${{ matrix.buildMatrix.targetPlatform }}-
            BuildLib-
            Library-

      - name: Verify Unity version (6000.3.9f1)
        run: |
          test -f ProjectSettings/ProjectVersion.txt || { echo "ProjectVersion.txt not found"; exit 1; }
          grep -q 'm_EditorVersion: 6000.3.9f1' ProjectSettings/ProjectVersion.txt || {
            echo "Unity version mismatch. Expected 6000.3.9f1"; cat ProjectSettings/ProjectVersion.txt; exit 1;
          }

      - name: Build with Unity (GameCI)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.buildMatrix.targetPlatform }}

      - name: Upload build artifacts (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.buildMatrix.targetPlatform }}-${{ github.sha }}
          path: build/${{ matrix.buildMatrix.targetPlatform }}
          retention-days: 1
          if-no-files-found: ignore
