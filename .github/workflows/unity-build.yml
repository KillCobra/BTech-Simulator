name: Unity Tests & Build

on:
  push:
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-build.yml'

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unity Tests (${{ matrix.testMode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify Unity version
        run: |
          test -f ProjectSettings/ProjectVersion.txt || { echo "ProjectVersion.txt not found"; exit 1; }
          grep -q 'm_EditorVersion: 6000.3.9f1' ProjectSettings/ProjectVersion.txt || {
            echo "Unity version mismatch. Expected 6000.3.9f1"; cat ProjectSettings/ProjectVersion.txt; exit 1;
          }

      - name: Run Unity tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.testMode }}-${{ github.sha }}
          path: ${{ steps.tests.outputs.artifactsPath || 'artifacts' }}
          retention-days: 1
          if-no-files-found: ignore

  build_on_main:
    name: Build Windows on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify Unity version
        run: |
          test -f ProjectSettings/ProjectVersion.txt || { echo "ProjectVersion.txt not found"; exit 1; }
          grep -q 'm_EditorVersion: 6000.3.9f1' ProjectSettings/ProjectVersion.txt || {
            echo "Unity version mismatch. Expected 6000.3.9f1"; cat ProjectSettings/ProjectVersion.txt; exit 1;
          }

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64

      - uses: actions/upload-artifact@v4
        with:
          name: UnityBuild-StandaloneWindows64
          path: build/StandaloneWindows64
          retention-days: 7
